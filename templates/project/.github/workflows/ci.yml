name: CI

# 最小可用 CI 模板。项目应按自己的技术栈增补作业。
# 注意：本项目模板的 CI 属于项目自有资产，不被框架同步覆盖。

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: install-lint-build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit project framework compliance
        run: python scripts/audit-project.py
